# Paraugs pēc nodarbības: atkarības ar zināmiem CVE un noslēpumi, arī Git vēsturē.
# Palaišana: cilne Actions → "drosiba" → Run workflow. Automātiski: katrā pull request.
#
# Katra darbība (action) ir piesprausta pie pilna commit SHA, nevis birkas (tag).
# Birku var pārvietot uz citu kodu, SHA nevar. Tā 2026. gada martā no CI tika
# nozagti noslēpumi: uzbrucējs pārvietoja Trivy darbības birkas uz savu kodu.
# Komentārs aiz SHA saka, kura versija tā ir; atjauniniet abus kopā.
name: drosiba

on:
  workflow_dispatch:
  pull_request:

# CI talonam tikai lasīšanas tiesības.
permissions:
  contents: read
  pull-requests: read

jobs:
  atkaribas:
    name: Atkarības ar zināmiem CVE (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SHA piesprauž darbības kodu. Docker attēlu tā iekšā joprojām izvēlas birka.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0

  noslepumi:
    name: Noslēpumi, arī Git vēsturē (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # visa vēsture, ne tikai pēdējā izmaiņa
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
